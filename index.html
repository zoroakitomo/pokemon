    <!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
    <title>ポケモン人気投票</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main class="container">
        
        <h1>ポケモン人気投票</h1>
        <p>みんなの好きなポケモンは？</p> 

        <form id="surveyForm">

             <div class="question">
                <h2>あなたが一番好きなポケモンは？</h2>

                <input type="text" id="searchBox" placeholder="ポケモンの名前を入力" autocomplete="off">

                <div id="searchResults"></div>
             </div>

             <button type="submit">投票！</button>
        </form>

        <p id="message"></p>
    </main>

    <script src="script.js"></script>

</body>
</html>
